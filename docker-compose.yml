---
services:
  console_backupper:
    container_name: console_backupper
    build: ./
    ports:
      - 8080:8080
    volumes:
      - "/tmp/console_backupper:/var/lib/console_backupper"
      - "./config.yml:/etc/console_backupper/config.yml:ro"
    develop:
      watch:
        - path: ./web
          action: rebuild
        - path: ./engine
          action: rebuild
        - path: ./main.go
          action: rebuild
        - path: ./templates
          target: /app/templates
          action: sync+restart
