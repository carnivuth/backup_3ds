<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Console Backupper dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div class="glow"></div>
    <div class="container">

      <header>
        <a href="/"><h1>Console Backupper dashboard</h1></a>
      </header>

      <div class="list">

        {{ range .Consoles }}
        <a href='/consoles/{{ .Name }}'>
          <div class='item'>
            <div class='item-icon' style='background:rgba(200,255,94,0.12)'>💾</div>
            <div class='item-body'>
              <div class='item-name'>{{ .Name }}</div>
              <div class='item-desc'> Done backup: {{ .DoneBackup }}</div>
            </div>
          </div>
        </a>
        {{ end }}
      </div>
    </div>
  </body>
</html>
